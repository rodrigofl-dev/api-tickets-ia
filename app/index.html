<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Tickets</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .form-section, .ticket-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #2980b9; }
        .btn-ia { background-color: #8e44ad; margin-top: 10px; }
        .btn-ia:hover { background-color: #732d91; }
        .ticket-card h3 { margin-top: 0; color: #2c3e50; }
        .status { display: inline-block; padding: 4px 8px; background: #e74c3c; color: white; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .ia-result { margin-top: 15px; padding: 10px; background: #f9ebff; border-left: 4px solid #8e44ad; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meus Tickets de Suporte</h1>

    <!-- Formulário para Criar Ticket -->
    <div class="form-section">
        <h2>Novo Ticket</h2>
        <input type="text" id="title" placeholder="Título do problema (ex: Sistema lento)" required>
        <textarea id="description" rows="3" placeholder="Descreva o problema com detalhes..." required></textarea>
        <button onclick="createTicket()">Abrir Ticket</button>
    </div>

    <!-- Lista de Tickets -->
    <div id="tickets-list">
        <!-- Os tickets vão aparecer aqui via JavaScript -->
    </div>
</div>

<script>
    // http://localhost:8000
    const API_URL = "https://api-tickets-ia.onrender.com/";

    // Busca os tickets ao carregar a página
    async function loadTickets() {
        const response = await fetch(`${API_URL}/tickets/`);
        const data = await response.json();
        const tickets = data.items;
        const list = document.getElementById('tickets-list');
        list.innerHTML = '';

        tickets.forEach(ticket => {
            const hasIA = ticket.ai_classification ? 'block' : 'none';
            const iaText = ticket.ai_classification || '';

            list.innerHTML += `
                <div class="ticket-card" id="ticket-${ticket.id}">
                    <h3>#${ticket.id} - ${ticket.title} <span class="status">${ticket.status}</span></h3>
                    <p>${ticket.description}</p>
                    
                    <button class="btn-ia" onclick="analyzeIA(${ticket.id})">✨ Classificar com IA</button>
                    
                    <div class="ia-result" id="ia-result-${ticket.id}" style="display: ${hasIA}">
                        <strong>Análise da IA:</strong> <span>${iaText}</span>
                    </div>
                </div>
            `;
        });
    }

    // Cria um novo ticket
    async function createTicket() {
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;

        if (!title || !description) return alert("Preencha todos os campos!");

        await fetch(`${API_URL}/tickets/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description })
        });

        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        loadTickets(); // Recarrega a lista
    }

    // Chama a rota de IA do seu backend
    async function analyzeIA(ticketId) {
        const btn = document.querySelector(`#ticket-${ticketId} .btn-ia`);
        btn.innerText = "⏳ Analisando...";
        btn.disabled = true;

        try {
            const response = await fetch(`${API_URL}/tickets/${ticketId}/classify`, { method: 'POST' });
            const ticketAtualizado = await response.json();
            
            // Mostra o resultado na tela
            const divIa = document.getElementById(`ia-result-${ticketId}`);
            divIa.style.display = 'block';
            divIa.querySelector('span').innerText = ticketAtualizado.ai_classification;
        } catch (error) {
            alert("Erro ao conectar com a IA.");
        } finally {
            btn.innerText = "✨ Classificar com IA";
            btn.disabled = false;
        }
    }

    // Inicia carregando os tickets
    loadTickets();
</script>

</body>
</html>
